<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uncle Sam's Procurement</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cyan:#00f0ff;--purple:#a855f7;--bg:#0a0a1a;--card:#111128;--text:#e0e0e0;--danger:#ff4757;--success:#2ed573;--warning:#ffa502}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
canvas#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:.3}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* Header */
.header{background:linear-gradient(135deg,#0f0f2e,#1a1a3e);border-bottom:1px solid rgba(0,240,255,.2);padding:20px 30px}
.header h1{font-size:24px;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;letter-spacing:1px}
.header p{color:#888;font-size:13px;margin-top:4px}
.stats-bar{display:flex;gap:20px;margin-top:15px;flex-wrap:wrap}
.stat-card{background:var(--card);border:1px solid rgba(0,240,255,.15);border-radius:10px;padding:12px 20px;min-width:150px}
.stat-card .label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px}
.stat-card .value{font-size:22px;font-weight:700;color:var(--cyan);margin-top:4px}

/* Layout */
.main{display:flex;flex:1}
.sidebar{width:280px;background:#0d0d24;border-right:1px solid rgba(0,240,255,.1);padding:20px;overflow-y:auto;max-height:calc(100vh - 120px);position:sticky;top:0}
.sidebar h3{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--purple);margin-bottom:15px}
.filter-group{margin-bottom:20px}
.filter-group label{display:block;font-size:12px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.filter-group select,.filter-group input{width:100%;background:#1a1a3a;border:1px solid rgba(0,240,255,.2);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;outline:none}
.filter-group select:focus,.filter-group input:focus{border-color:var(--cyan)}
.content{flex:1;padding:20px 30px;overflow-y:auto}

/* Hot Deals */
.section-title{font-size:16px;font-weight:700;margin-bottom:15px;display:flex;align-items:center;gap:8px}
.section-title .icon{font-size:20px}
.hot-deals{display:flex;gap:15px;overflow-x:auto;padding-bottom:15px;margin-bottom:30px}
.hot-card{min-width:300px;max-width:350px;background:linear-gradient(135deg,#1a1a3e,#2a1a4e);border:1px solid rgba(168,85,247,.3);border-radius:12px;padding:18px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.hot-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(168,85,247,.1) 0%,transparent 70%);animation:pulse 3s infinite}
.hot-card:hover{transform:translateY(-3px);border-color:var(--purple);box-shadow:0 8px 30px rgba(168,85,247,.2)}
.hot-card .score{position:absolute;top:12px;right:12px;background:var(--purple);color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;z-index:1}
.hot-card .title{font-size:14px;font-weight:600;margin-bottom:8px;line-height:1.4;z-index:1;position:relative}
.hot-card .agency{font-size:12px;color:var(--cyan);margin-bottom:6px}
.hot-card .meta{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:8px}
.hot-card .value{color:var(--success);font-weight:600;font-size:13px}

/* Feed */
.feed-card{background:var(--card);border:1px solid rgba(0,240,255,.08);border-radius:10px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all .2s}
.feed-card:hover{border-color:rgba(0,240,255,.3);transform:translateX(3px)}
.feed-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.feed-card .title{font-size:14px;font-weight:600;flex:1;margin-right:12px}
.feed-card .score-badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.score-high{background:rgba(46,213,115,.15);color:var(--success)}
.score-mid{background:rgba(255,165,2,.15);color:var(--warning)}
.score-low{background:rgba(255,71,87,.15);color:var(--danger)}
.feed-card .agency{font-size:12px;color:var(--cyan);margin-bottom:4px}
.feed-card .details{display:flex;gap:20px;font-size:12px;color:#888;margin-top:8px}
.feed-card .details span{display:flex;align-items:center;gap:4px}
.feed-card .value{color:var(--success);font-weight:600}

/* Detail Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#12122e;border:1px solid rgba(0,240,255,.2);border-radius:16px;width:90%;max-width:700px;max-height:80vh;overflow-y:auto;padding:30px;position:relative}
.modal .close{position:absolute;top:15px;right:20px;font-size:24px;cursor:pointer;color:#888;background:none;border:none}
.modal .close:hover{color:var(--cyan)}
.modal h2{font-size:18px;margin-bottom:15px;line-height:1.4}
.modal .score-breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}
.modal .score-item{background:#1a1a3a;border-radius:8px;padding:10px}
.modal .score-item .s-label{font-size:11px;color:#888;text-transform:uppercase}
.modal .score-item .s-value{font-size:16px;font-weight:600;color:var(--cyan);margin-top:4px}
.modal .description{font-size:13px;line-height:1.6;color:#bbb;margin-top:15px;padding:15px;background:#1a1a3a;border-radius:8px}
.modal .countdown{text-align:center;font-size:14px;color:var(--warning);margin-top:15px;font-weight:600}

/* Loading */
.loading{text-align:center;padding:60px;color:#888}
.spinner{width:40px;height:40px;border:3px solid rgba(0,240,255,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* Responsive */
@media(max-width:768px){.sidebar{display:none}.stats-bar{gap:10px}.stat-card{min-width:120px;padding:8px 12px}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="app">
  <div class="header">
    <h1>🦅 UNCLE SAM'S PROCUREMENT</h1>
    <p>Real-time federal contract intelligence — powered by SAM.gov</p>
    <div class="stats-bar" id="statsBar">
      <div class="stat-card"><div class="label">Total Opportunities</div><div class="value" id="statTotal">—</div></div>
      <div class="stat-card"><div class="label">Total Value</div><div class="value" id="statValue">—</div></div>
      <div class="stat-card"><div class="label">Avg Deal Size</div><div class="value" id="statAvg">—</div></div>
      <div class="stat-card"><div class="label">Hot Deals</div><div class="value" id="statHot">—</div></div>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <h3>⚙ Filters</h3>
      <div class="filter-group"><label>NAICS Code</label><input type="text" id="filterNaics" placeholder="e.g. 541512"></div>
      <div class="filter-group"><label>Value Range</label>
        <select id="filterValue"><option value="">All Values</option><option value="0-100000">Under $100K</option><option value="100000-1000000">$100K - $1M</option><option value="1000000-10000000">$1M - $10M</option><option value="10000000-999999999">$10M+</option></select>
      </div>
      <div class="filter-group"><label>Agency</label><input type="text" id="filterAgency" placeholder="e.g. Defense"></div>
      <div class="filter-group"><label>Set-Aside</label>
        <select id="filterSetAside"><option value="">All Types</option><option value="S">Small Business</option><option value="W">Women-Owned</option><option value="SDVOSBC">Veteran-Owned</option><option value="8a">8(a)</option></select>
      </div>
      <div class="filter-group"><label>Deadline</label>
        <select id="filterDeadline"><option value="">Any</option><option value="7">Within 7 days</option><option value="14">Within 14 days</option><option value="30">Within 30 days</option></select>
      </div>
      <div class="filter-group"><button onclick="fetchData()" style="width:100%;padding:10px;background:linear-gradient(90deg,var(--cyan),var(--purple));color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px">🔍 SEARCH</button></div>
    </div>
    <div class="content">
      <div class="section-title"><span class="icon">🔥</span> Hot Deals</div>
      <div class="hot-deals" id="hotDeals"><div class="loading"><div class="spinner"></div>Loading contracts...</div></div>
      <div class="section-title"><span class="icon">📋</span> All Opportunities</div>
      <div id="feed"><div class="loading"><div class="spinner"></div>Loading...</div></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="close" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const API_KEY='SAM-c4fabfb2-fcf1-4225-a9c5-b56c6b9e91bd';
let allOpportunities=[];

// Background animation
const canvas=document.getElementById('bgCanvas'),ctx=canvas.getContext('2d');
let particles=[];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
for(let i=0;i<50;i++)particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+1,c:Math.random()>.5?'rgba(0,240,255,':'rgba(168,85,247,'});
function drawBg(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c+'0.4)';ctx.fill()});particles.forEach((a,i)=>{particles.slice(i+1).forEach(b=>{const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(0,240,255,0.05)';ctx.stroke()}})});requestAnimationFrame(drawBg)}
drawBg();

function scoreDeal(opp){
  let score=0;
  const val=parseFloat(opp.dollarValue||0);
  if(val>=10000000)score+=30;else if(val>=1000000)score+=25;else if(val>=100000)score+=15;else if(val>=10000)score+=8;
  const deadline=opp.responseDeadLine?new Date(opp.responseDeadLine):null;
  if(deadline){const days=(deadline-new Date())/(1000*60*60*24);if(days>=7&&days<=30)score+=25;else if(days>=3&&days<7)score+=15;else if(days>30)score+=10;else if(days>=0)score+=5}
  const type=(opp.type||'').toLowerCase();
  if(type.includes('set-aside')||type.includes('small business'))score+=15;
  if(type.includes('8(a)'))score+=12;
  const status=(opp.active||'').toLowerCase();
  if(status==='yes'||status==='y')score+=10;
  if(val>0)score+=10;
  return Math.min(100,Math.max(0,score));
}

function formatMoney(n){if(!n||isNaN(n))return'N/A';if(n>=1e9)return'$'+(n/1e9).toFixed(1)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(0)+'K';return'$'+n}

function daysUntil(d){if(!d)return null;const diff=(new Date(d)-new Date())/(1000*60*60*24);return Math.max(0,Math.round(diff))}

function renderStats(opps){
  const total=opps.length;
  const totalVal=opps.reduce((s,o)=>s+parseFloat(o.dollarValue||0),0);
  const avg=total?totalVal/total:0;
  const hot=opps.filter(o=>o._score>=70).length;
  document.getElementById('statTotal').textContent=total.toLocaleString();
  document.getElementById('statValue').textContent=formatMoney(totalVal);
  document.getElementById('statAvg').textContent=formatMoney(avg);
  document.getElementById('statHot').textContent=hot;
}

function renderHotDeals(opps){
  const hot=opps.filter(o=>o._score>=50).sort((a,b)=>b._score-a._score).slice(0,10);
  document.getElementById('hotDeals').innerHTML=hot.length?hot.map(o=>`
    <div class="hot-card" onclick='showDetail(${JSON.stringify(o).replace(/'/g,"&#39;")})'>
      <div class="score">${o._score}</div>
      <div class="title">${o.title||'Untitled'}</div>
      <div class="agency">${o.agency||'Unknown Agency'}</div>
      <div class="meta"><span class="value">${formatMoney(parseFloat(o.dollarValue||0))}</span><span>⏰ ${daysUntil(o.responseDeadLine)||'?'} days</span></div>
    </div>`).join(''):'<div class="loading">No hot deals found. Try adjusting filters.</div>';
}

function renderFeed(opps){
  const sorted=opps.sort((a,b)=>b._score-a._score);
  document.getElementById('feed').innerHTML=sorted.length?sorted.map(o=>{
    const s=o._score;const cls=s>=70?'score-high':s>=40?'score-mid':'score-low';
    return`<div class="feed-card" onclick='showDetail(${JSON.stringify(o).replace(/'/g,"&#39;")})'>
      <div class="top-row"><div class="title">${o.title||'Untitled'}</div><span class="score-badge ${cls}">${s}/100</span></div>
      <div class="agency">${o.agency||'Unknown'} ${o.office||''}</div>
      <div class="details"><span class="value">💰 ${formatMoney(parseFloat(o.dollarValue||0))}</span><span>📅 ${o.postedDate||'N/A'}</span><span>⏰ ${daysUntil(o.responseDeadLine)||'?'}d left</span><span>${o.naicsCode||''}</span></div>
    </div>`}).join(''):'<div class="loading">No opportunities found.</div>';
}

function showDetail(o){
  const deadline=o.responseDeadLine?new Date(o.responseDeadLine):null;
  const days=daysUntil(o.responseDeadLine);
  document.getElementById('modalContent').innerHTML=`
    <h2>${o.title||'Untitled'}</h2>
    <div class="score-breakdown">
      <div class="score-item"><div class="s-label">Overall Score</div><div class="s-value">${o._score}/100</div></div>
      <div class="score-item"><div class="s-label">Value</div><div class="s-value">${formatMoney(parseFloat(o.dollarValue||0))}</div></div>
      <div class="score-item"><div class="s-label">Agency</div><div class="s-value">${o.agency||'N/A'}</div></div>
      <div class="score-item"><div class="s-label">Office</div><div class="s-value">${o.office||'N/A'}</div></div>
      <div class="score-item"><div class="s-label">NAICS</div><div class="s-value">${o.naicsCode||'N/A'}</div></div>
      <div class="score-item"><div class="s-label">Type</div><div class="s-value">${o.type||'N/A'}</div></div>
      <div class="score-item"><div class="s-label">Posted</div><div class="s-value">${o.postedDate||'N/A'}</div></div>
      <div class="score-item"><div class="s-label">Deadline</div><div class="s-value">${deadline?deadline.toLocaleDateString():'N/A'}</div></div>
    </div>
    ${deadline?`<div class="countdown">⏰ ${days} days remaining to submit</div>`:''}
    <div class="description">${o.description||o.shortDesc||'No description available.'}</div>
    ${o.solicitationNumber?`<p style="margin-top:10px;font-size:12px;color:#888">Solicitation #: ${o.solicitationNumber}</p>`:''}
  `;
  document.getElementById('modal').classList.add('active');
}

function closeModal(){document.getElementById('modal').classList.remove('active')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

async function fetchData(){
  document.getElementById('hotDeals').innerHTML='<div class="loading"><div class="spinner"></div>Fetching from SAM.gov...</div>';
  document.getElementById('feed').innerHTML='<div class="loading"><div class="spinner"></div>Loading...</div>';
  
  let url=`https://api.sam.gov/opportunities/v2/search?api_key=${API_KEY}&limit=100&offset=0&postedFrom=${new Date(Date.now()-30*86400000).toISOString().split('T')[0]}&postedTo=${new Date().toISOString().split('T')[0]}`;
  
  const naics=document.getElementById('filterNaics').value;
  const valRange=document.getElementById('filterValue').value;
  const agency=document.getElementById('filterAgency').value;
  const setAside=document.getElementById('filterSetAside').value;
  const deadline=document.getElementById('filterDeadline').value;
  
  if(naics)url+=`&naicsCode=${naics}`;
  if(agency)url+=`&agency=${agency}`;
  if(setAside)url+=`&typeOfSetAsideDescription=${setAside}`;
  
  try{
    const resp=await fetch(url);
    const data=await resp.json();
    let opps=(data.opportunitiesData||[]).map(o=>({...o,_score:scoreDeal(o)}));
    
    if(valRange){const[min,max]=valRange.split('-').map(Number);opps=opps.filter(o=>{const v=parseFloat(o.dollarValue||0);return v>=min&&v<=max})}
    if(deadline){const days=parseInt(deadline);opps=opps.filter(o=>{const d=daysUntil(o.responseDeadLine);return d!==null&&d<=days})}
    
    allOpportunities=opps;
    renderStats(opps);
    renderHotDeals(opps);
    renderFeed(opps);
  }catch(e){
    document.getElementById('feed').innerHTML=`<div class="loading">Error fetching data: ${e.message}<br><br>API may be rate limited. Try again in a minute.</div>`;
  }
}

fetchData();
</script>
</body>
</html>
